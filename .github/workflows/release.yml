name: Build and publish monitoring platform

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-release-main
  cancel-in-progress: false

jobs:
  certbot-debian:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    timeout-minutes: 10
    steps:
      - name: Install Debian Certbot test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 certbot openssl
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test isolated Certbot without ACME requests
        run: |
          /usr/bin/python3 -c "from certbot._internal import constants"
          /usr/bin/python3 -m unittest discover -s tests -p 'test_deploy_certbot.py' -v
  build-and-release:
    needs: certbot-debian
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Install local Nginx and Certbot test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx openssl certbot iputils-ping
      - name: Test installer and updater
        run: |
          bash -n install.sh
          /usr/bin/python3 -c "from certbot._internal import constants"
          /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py' -v
          bash -n agent/install.sh
      - name: Build monitoring frontend
        run: |
          node tests/test_frontend.mjs
          npm run build
      - name: Package verified build
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python3 scripts/deploy/package_release.py --commit "$SOURCE_SHA"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deploy/publish_release.py release-assets/xiaowork-watch-web.tar.gz release-assets/xiaowork-watch-web.tar.gz.sha256
